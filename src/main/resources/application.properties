spring.application.name=trentplayer-backend

# Load local secrets from .env in the project root. That file is gitignored.
# optional: means production can set the same keys as real environment variables instead.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL 18 on this host listens on 5432. Port 5435 is pgAdmin 4, not the database engine.
# The existing catalog is quoted mixed-case TrentPlayer.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=10000

# Hibernate settings to auto-create tables matching our Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Audio files live only in this directory. On this PC that is the OneDrive folder
# TrentPlayer-Music. Override with MEDIA_ROOT in .env if the folder moves.
# A restart is required after changing the path. Files added later are picked up
# by GET /api/v1/audio/tracks without another restart.
trentplayer.media.root=${MEDIA_ROOT:C:/Users/GIDEON ASUMANG/OneDrive/TrentPlayer-Music}

# HS256 signing key must be at least 256 bits (32 UTF-8 bytes). Loaded from .env / environment.
# NOTE: rotating this secret invalidates every issued access AND refresh token; clients must log in again.
trentplayer.jwt.secret=${JWT_SECRET}
# Access token lifetime (15 minutes). Short on purpose: the client silently refreshes.
trentplayer.jwt.expiration-ms=900000
# Refresh token lifetime (30 days). Only accepted by POST /api/v1/auth/refresh.
trentplayer.jwt.refresh-expiration-ms=2592000000

# Avoid lazy database access during JSON rendering.
spring.jpa.open-in-view=false
